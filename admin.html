<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">⚙ <span>Админ-панель</span></div>
    <button class="btn small secondary" onclick="location.href='lobby.html'">В лобби</button>
  </div>

  <div class="card">
    <h2>🏆 Топ победителей</h2>
    <div style="margin-bottom:10px">
      <select id="leaderboardFilter" onchange="renderLeaderboard()" style="max-width:260px; display:inline-block">
        <option value="total">Все игры (сумма побед)</option>
        <option value="bunker">Только Бункер</option>
        <option value="mafia">Только Мафия</option>
      </select>
    </div>
    <div id="leaderboardBox" class="muted">Загрузка...</div>
  </div>

  <div class="card">
    <h2>Пользователи</h2>
    <div id="usersBox" class="muted">Загрузка...</div>
  </div>

  <div class="card">
    <h2>Активные / последние комнаты</h2>
    <div id="roomsBox" class="muted">Загрузка...</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script>
let me, profile;
let allProfiles = [];
let statsMap = {};
let roomsChannel = null;

async function init(){
  me = await requireAuth();
  if(!me) return;
  profile = await getProfile(me.id);
  await cleanupInactiveRooms();
  if(!profile?.is_admin){
    document.querySelector('.wrap').innerHTML = `<div class="card"><h2>Нет доступа</h2><p class="muted">Эта страница только для админов.</p><a href="lobby.html">В лобби</a></div>`;
    return;
  }
  await loadUsers();
  renderLeaderboard();
  await loadRooms();
  if(!roomsChannel){
    roomsChannel = sb.channel('admin-rooms');
    roomsChannel
      .on('postgres_changes', { event:'*', schema:'public', table:'rooms' }, loadRooms)
      .on('postgres_changes', { event:'*', schema:'public', table:'room_players' }, loadRooms)
      .subscribe();
  }
}

async function loadUsers(){
  const { data: profiles } = await sb.from('profiles').select('*').order('created_at', { ascending:false });
  const { data: stats } = await sb.from('stats').select('*');
  allProfiles = profiles || [];
  statsMap = {};
  (stats||[]).forEach(s => statsMap[s.user_id] = s);

  usersBox.innerHTML = `<table>
    <tr><th>Ник</th><th>Регистрация</th><th>Бункер (сыгр/побед)</th><th>Мафия (сыгр/побед)</th><th>Админ</th><th></th></tr>
    ${allProfiles.map(p=>{
      const s = statsMap[p.id] || {};
      return `<tr>
        <td>${esc(p.nickname)}</td>
        <td>${new Date(p.created_at).toLocaleDateString('ru-RU')}</td>
        <td>${s.bunker_played||0} / ${s.bunker_won||0}</td>
        <td>${s.mafia_played||0} / ${s.mafia_won||0}</td>
        <td>${p.is_admin ? '✅' : '—'}</td>
        <td>
          <button class="btn small secondary" onclick="toggleAdmin('${p.id}', ${!p.is_admin})">${p.is_admin?'Снять админа':'Сделать админом'}</button>
          <button class="btn small danger" onclick="resetStats('${p.id}')">Сбросить статистику</button>
        </td>
      </tr>`;
    }).join('')}
  </table>`;
}

function renderLeaderboard(){
  const mode = document.getElementById('leaderboardFilter')?.value || 'total';
  const rows = allProfiles.map(p=>{
    const s = statsMap[p.id] || {};
    const bunkerWon = s.bunker_won || 0;
    const mafiaWon = s.mafia_won || 0;
    const totalWon = bunkerWon + mafiaWon;
    const totalPlayed = (s.bunker_played||0) + (s.mafia_played||0);
    const sortValue = mode==='bunker' ? bunkerWon : mode==='mafia' ? mafiaWon : totalWon;
    return { nickname:p.nickname, bunkerWon, mafiaWon, totalWon, totalPlayed, sortValue };
  })
  .filter(r => r.sortValue > 0)
  .sort((a,b)=> b.sortValue - a.sortValue);

  if(rows.length===0){
    leaderboardBox.innerHTML = `<p class="muted">Пока никто не побеждал ни в одной игре.</p>`;
    return;
  }

  const medals = ['🥇','🥈','🥉'];
  leaderboardBox.innerHTML = `<table>
    <tr><th>#</th><th>Ник</th><th>Побед в Бункере</th><th>Побед в Мафии</th><th>Всего побед</th></tr>
    ${rows.map((r,i)=>`<tr>
      <td>${medals[i] || (i+1)}</td>
      <td>${esc(r.nickname)}</td>
      <td>${r.bunkerWon}</td>
      <td>${r.mafiaWon}</td>
      <td><b>${r.totalWon}</b></td>
    </tr>`).join('')}
  </table>`;
}

async function toggleAdmin(userId, value){
  await sb.from('profiles').update({ is_admin: value }).eq('id', userId);
  toast('Обновлено');
  loadUsers();
}

async function resetStats(userId){
  if(!confirm('Точно сбросить статистику этого игрока?')) return;
  await sb.from('stats').update({ bunker_played:0, bunker_won:0, mafia_played:0, mafia_won:0 }).eq('user_id', userId);
  toast('Статистика сброшена');
  await loadUsers();
  renderLeaderboard();
}

async function loadRooms(){
  const { data: rooms } = await sb.from('rooms').select('*').order('created_at', { ascending:false }).limit(30);
  roomsBox.innerHTML = `<table>
    <tr><th>Код</th><th>Игра</th><th>Статус</th><th>Создана</th><th></th></tr>
    ${(rooms||[]).map(r=>`<tr>
      <td>${esc(r.code)}</td>
      <td>${r.game_type==='bunker'?'🏕 Бункер':'🔪 Мафия'}</td>
      <td>${r.status}</td>
      <td>${new Date(r.created_at).toLocaleString('ru-RU')}</td>
      <td><button class="btn small danger" onclick="deleteRoom('${r.id}')">Удалить</button></td>
    </tr>`).join('')}
  </table>`;
}

async function deleteRoom(id){
  if(!confirm('Удалить комнату?')) return;
  await sb.from('room_players').delete().eq('room_id', id);
  await sb.from('rooms').delete().eq('id', id);
  toast('Комната удалена');
  await loadRooms();
}

init();
</script>
</body>
</html>
